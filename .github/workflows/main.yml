name: DevHub — Build Tauri Linux

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  nextjs-build:
    name: 🔨 Verificar Build Next.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci --legacy-peer-deps

      - name: Build Next.js (verificación)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

  tauri-build-linux:
    name: 🖥️ Build Tauri Linux (.deb + .AppImage)
    runs-on: ubuntu-22.04
    needs: [nextjs-build]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust/Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Instalar dependencias del sistema (WebKit2GTK + GTK3)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            pkg-config \
            wget \
            curl

      - name: Instalar dependencias Node
        run: npm ci --legacy-peer-deps

      - name: Instalar deps del sidecar
        run: |
          cd sidecar-backend
          npm ci

      - name: Build Tauri (genera .deb y .AppImage)
        run: npm run tauri:build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Listar artefactos generados
        run: |
          echo "=== Artefactos de distribución ==="
          find src-tauri/target/release/bundle -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.rpm" \) 2>/dev/null || echo "No se encontraron artefactos de bundle"
          ls -lah src-tauri/target/release/ | grep devhub || true

      - name: Subir .AppImage como artefacto de CI
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: devhub-linux-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 30

      - name: Subir .deb como artefacto de CI
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: devhub-linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          retention-days: 30

      # Crear GitHub Release con assets cuando es un tag v*
      - name: Crear GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
