# DevHub Electron packaging (E1 — minimal but real NSIS config)
# Invoke from repo root:
#   pnpm electron:pack   # dir unpacked
#   pnpm electron:build  # NSIS installer
#
# Main entry is set via extraMetadata (package.json has no top-level "main").

appId: com.devhub.desktop
productName: DevHub
copyright: Copyright © DevHub

# electron-builder runs with cwd = package.json directory (repo root)
directories:
  output: dist/electron
  buildResources: desktop/electron/packaging

# Use the Electron host as the app entry without changing package.json "main" for Next.
extraMetadata:
  main: desktop/electron/main.js

files:
  - desktop/electron/**/*
  - package.json
  - '!desktop/electron/**/*.test.js'
  - '!desktop/electron/scripts/**'
  # The electron shell only needs: electron-updater, node-pty, ws, better-sqlite3.
  # Everything below is build-time or frontend-only (served via standalone.zip).
  - '!node_modules/@next/**'
  - '!node_modules/@img/**'
  - '!node_modules/@tailwindcss/**'
  - '!node_modules/@swc/**'
  - '!node_modules/lightningcss*/**'
  - '!node_modules/next/**'
  - '!node_modules/react/**'
  - '!node_modules/react-dom/**'
  - '!node_modules/tailwindcss/**'
  - '!node_modules/postcss/**'
  - '!node_modules/autoprefixer/**'
  - '!node_modules/@monaco-editor/**'
  - '!node_modules/monaco-editor/**'
  - '!node_modules/@xterm/**'
  - '!node_modules/xterm/**'
  - '!node_modules/@radix-ui/**'
  - '!node_modules/@fontsource/**'
  - '!node_modules/recharts/**'
  - '!node_modules/framer-motion/**'
  - '!node_modules/konva/**'
  - '!node_modules/react-konva/**'
  - '!node_modules/@supabase/**'
  - '!node_modules/openai/**'
  - '!node_modules/typescript/**'
  - '!node_modules/eslint*/**'
  - '!node_modules/jest*/**'
  - '!node_modules/playwright*/**'
  - '!node_modules/electron/**'
  - '!node_modules/sharp/**'

# Packaged resource layout (read by packaging/runtime.js via process.resourcesPath):
#   resources/standalone.zip
#   resources/devhub-server.cjs  (optional)
extraResources:
  - from: src-tauri/resources
    to: resources
    filter:
      - '**/*'
      - '!**/.*'
      - '!**/*.tmp'
  - from: sidecar-backend
    to: resources/sidecar-backend
    filter:
      - '**/*'
      - '!**/.*'
      - '!**/*.tmp'
  - from: sidecar-backend/node_modules
    to: resources/sidecar-backend/node_modules
    filter:
      - '**/*'
      - '!**/.*'
  - from: packages/veloce-audio/python
    to: resources/veloce-audio
    filter:
      - 'requirements.txt'
      - 'voices/**/*'

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: src-tauri/icons/icon.ico
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}

nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DevHub
  deleteAppDataOnUninstall: false

# Publish config enables latest.yml generation and bakes resources/app-update.yml
# into the installer (required by electron-updater). The default URL is the local
# dev feed served by `pnpm electron:feed`; override at runtime with DEVHUB_UPDATE_URL,
# or rebuild with the production URL for real distribution.
publish:
  - provider: generic
    url: http://127.0.0.1:9100/devhub
    channel: latest

# Electron version comes from devDependency "electron"
electronVersion: null
