[package]
name = "devhub"
default-run = "devhub"
version = "0.1.0"
description = "DevHub — Autonomous Dev Workspace"
authors = ["DevHub Contributors"]
license = "MIT"
repository = "https://github.com/devhub/devhub"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "devhub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
tauri-plugin-shell = "2.3.5"
tauri-plugin-notification = "2"
sysinfo = "0.36.1"
dirs = "6.0.0"
tauri-plugin-dialog = "2.0.0-rc"
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"

[target.'cfg(target_os = "linux")'.dependencies]
glib = "0.18.5"
libc = "0.2"
gtk = "0.18.2"
cairo-rs = "0.18"
webkit2gtk = "2.0.2"
javascriptcore = { package = "javascriptcore-rs", version = "1.1.2" }
zoha-vte = { version = "0.6.0", features = ["v0_72"] }

[[bin]]
name = "gtk_vte_smoke"
path = "linux-bin/gtk_vte_smoke.rs"
required-features = ["gtk-vte-smoke"]

[features]
gtk-vte-smoke = []

[profile.release]
codegen-units = 16
lto = "thin"
strip = true
opt-level = 3
panic = "abort"
incremental = true

